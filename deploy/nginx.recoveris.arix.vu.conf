# Isolated site for recoveris.arix.vu — static mirror of recoveris.io from /var/www/recoveris.arix.vu/main
server {
    server_name recoveris.arix.vu;
    root /var/www/recoveris.arix.vu/main;
    index index.html;

    # Pretty permalinks: /slug/ -> /slug/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/recoveris.arix.vu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recoveris.arix.vu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = recoveris.arix.vu) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name recoveris.arix.vu;
    return 404;
}
