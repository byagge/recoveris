# Isolated site for recoveris.arix.vu — static mirror from /var/www/recoveris.arix.vu/main
server {
    server_name recoveris.arix.vu;
    root /var/www/recoveris.arix.vu/main;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        application/font-woff;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/recoveris.arix.vu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recoveris.arix.vu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = recoveris.arix.vu) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name recoveris.arix.vu;
    return 404;
}
